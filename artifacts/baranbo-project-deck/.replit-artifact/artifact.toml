kind = "slides"
previewPath = "/baranbo-project-deck/"
title = "France Marquage Baranbo Project Deck"
description = "An eight-slide presentation introducing the France Marquage Baranbo website project, its road marking services, multilingual experience, visual identity, and contact journey."
version = "1.0.0"
id = "artifacts/baranbo-project-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/baranbo-project-deck/" ]
localPort = 22913

[services.development]
run = "pnpm --filter @workspace/baranbo-project-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/baranbo-project-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/baranbo-project-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22913"
BASE_PATH = "/baranbo-project-deck/"
